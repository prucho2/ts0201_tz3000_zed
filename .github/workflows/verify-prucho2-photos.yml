name: Verify Prucho2 PCB photos
on:
  push:
    branches: [main]
    paths:
      - 'New Firmware Prucho2/**/images/*.webp'
      - '.github/workflows/verify-prucho2-photos.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check PCB photos decode correctly
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          ImageFile.LOAD_TRUNCATED_IMAGES = False
          for d in ['0x2B - ZTH01 JQ V2.0','0x2C - GXHTV4']:
              p=Path('New Firmware Prucho2')/d/'images/pcb.webp'
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  im.load()
                  assert im.width > 150 and im.height > 80, (p,im.size)
                  print(f'{p}: valid PCB photograph {im.width}x{im.height}')
          PY
