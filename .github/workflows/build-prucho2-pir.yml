name: Build Prucho2 ZG-204ZL PIR experimental

on:
  workflow_dispatch:
  push:
    branches:
      - dev/prucho2-pir-zg204zl
    paths:
      - 'src/**'
      - 'project.mk'
      - 'makefile'
      - '.github/workflows/build-prucho2-pir.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 curl bzip2 libncurses5
      - name: Install Telink TC32 compiler
        run: |
          sudo mkdir -p /opt/tc32
          curl -fL --retry 3 "https://raw.githubusercontent.com/prucho2/ZigbeeTLc-PIR/master/tools/linux/tc32_gcc_v2.0.tar.bz2" -o /tmp/tc32.tar.bz2
          sudo tar -xjf /tmp/tc32.tar.bz2 -C /opt/tc32
          COMPILER=$(find /opt/tc32 -type f -name tc32-elf-gcc -print -quit)
          test -n "$COMPILER"
          if [ "$(dirname "$COMPILER")" != "/opt/tc32/bin" ]; then
            sudo ln -s "$(dirname "$COMPILER")" /opt/tc32/bin
          fi
          /opt/tc32/bin/tc32-elf-gcc --version
      - name: Create development date code
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          d = datetime.now(timezone.utc).strftime('%Y%m%d')
          Path('src/include/sonoff_build_date.h').write_text(
              '#ifndef SONOFF_BUILD_DATE_H\n#define SONOFF_BUILD_DATE_H\n'
              + '#define SONOFF_BUILD_DATE {8,' + ','.join(repr(c) for c in d)
              + '}\n#endif\n')
          PY
      - name: Build independent ZG-204ZL PIR target
        run: |
          make PROJECT_NAME=prucho2_zg204zl_pir PROJECT_DEF=-DBOARD=BOARD_PRUCHO2_PIR_ZG204ZL DEBUG=-DUART_PRINTF_MODE=OFF 2>&1 | tee /tmp/prucho2-pir-build.log
      - name: Validate binary metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bin/prucho2_zg204zl_pir_last_version.bin')
          b=p.read_bytes()
          assert len(b)>10000, len(b)
          v=int.from_bytes(b[2:6],'little')
          m=int.from_bytes(b[18:20],'little')
          image=int.from_bytes(b[20:22],'little')
          print(f'BIN size={len(b)} version=0x{v:08x} manufacturer=0x{m:04x} image=0x{image:04x}')
          assert v==0x01453001
          assert m==0x6565
          assert image==0x022d
          PY
      - name: Archive test build only
        uses: actions/upload-artifact@v4
        with:
          name: prucho2-pir-zg204zl-v0.1.45-UNTESTED
          path: |
            bin/prucho2_zg204zl_pir_last_version.bin
            bin/*prucho2_zg204zl_pir*.zigbee
          if-no-files-found: error
          retention-days: 14
      - name: Record experimental build status on development branch
        if: always()
        env:
          BUILD_STATUS: ${{ job.status }}
        shell: bash
        run: |
          mkdir -p docs
          {
            echo "# ZG-204ZL experimental firmware build status"
            echo
            echo "Workflow result: **${BUILD_STATUS}**"
            echo
            echo "Source SHA: \`${GITHUB_SHA}\`"
            echo
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "This is development-only and not approved for flashing."
            echo
            echo "## Last compiler output"
            echo
            echo '\`\`\`text'
            if [ -s /tmp/prucho2-pir-build.log ]; then
              tail -n 75 /tmp/prucho2-pir-build.log
            else
              echo 'Compiler did not run or no log was captured.'
            fi
            echo '\`\`\`'
          } > docs/PRUCHO2_PIR_BUILD_STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRUCHO2_PIR_BUILD_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "ci: record experimental PIR build status [skip ci]"
            if ! git push; then
              echo "Nonfatal: build artifact is uploaded, status markdown push raced with another commit."
            fi
          fi
